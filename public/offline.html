<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3f75">
  <title>Sem conexão — Organize</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#172b4d;background:#f7f8fa;color-scheme:light dark}
    body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{max-width:380px;background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:30px;box-shadow:0 12px 30px #09284619}
    .mark{display:inline-flex;align-items:center;justify-content:center;background:#0b3f75;color:#fff;width:42px;height:42px;border-radius:10px;font-weight:800;margin-bottom:16px}
    h1{font-size:24px;margin:0 0 10px}p{line-height:1.5;color:#44546f;margin:0 0 22px}
    button{background:#0b6bcb;color:#fff;border:0;border-radius:6px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
    @media(prefers-color-scheme:dark){:root{background:#111a2a;color:#e9eff9}main{background:#1b2739;border-color:#34465f}p{color:#aab9ce}}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">O</div><h1>Sem conexão com o Organize</h1><p>O aplicativo está instalado, mas seus quadros e cartões ficam no servidor. Conecte o celular à rede que alcança o servidor e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
